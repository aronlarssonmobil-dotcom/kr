<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KR-5 APEX — interaktiv 3D-visare</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0c10; overflow: hidden;
               font-family: "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  .hud { position: fixed; left: 20px; top: 18px; color: #e8e9ec; z-index: 5;
         pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .hud h1 { font-size: 20px; letter-spacing: .14em; margin: 0; font-weight: 700; }
  .hud h1 em { color: #ff5a1f; font-style: normal; }
  .hud p { margin: 4px 0 0; font-size: 12px; opacity: .65; letter-spacing: .04em; }
  .spec { position: fixed; right: 20px; bottom: 18px; color: #cfd2d8; z-index: 5;
          font-size: 11.5px; line-height: 1.75; text-align: right; opacity: .8;
          pointer-events: none; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .spec b { color: #ff5a1f; font-weight: 600; }
  #load { position: fixed; inset: 0; display: grid; place-items: center;
          color: #9aa0aa; font-size: 13px; letter-spacing: .1em; z-index: 4; }
  .foot { position: fixed; left: 20px; bottom: 16px; color: #7b818c; font-size: 11px;
          z-index: 5; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="hud">
  <h1>KR-5 <em>APEX</em></h1>
  <p>5" FREESTYLE FPV &nbsp;·&nbsp; PARAMETRISK CAD &nbsp;·&nbsp; BLENDER → glTF</p>
</div>
<div class="spec">
  hjulbas <b>224.9 mm</b> · motorer <b>2306.5&nbsp;1750KV</b><br>
  propellrar <b>5.1×4.9×3</b> · stack <b>30.5×30.5</b> F7 + 60A<br>
  batteri <b>6S 1300 mAh</b> · AUW ≈ <b>645 g</b>
</div>
<div class="foot">vänster mus: rotera · höger: panorera · scroll: zoom · dubbelklick: autorotation</div>
<div id="load">LÄSER IN MODELL …</div>
<div id="app"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.environment = new THREE.PMREMGenerator(renderer)
  .fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.005, 20);
camera.position.set(0.34, 0.22, 0.42);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.045, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.08;
controls.maxDistance = 2.0;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
addEventListener('dblclick', () => controls.autoRotate = !controls.autoRotate);

// studio
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 64),
  new THREE.MeshStandardMaterial({ color: 0x101114, roughness: 0.45, metalness: 0 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.DirectionalLight(0xfff4e6, 3.2);
key.position.set(0.6, 0.9, 0.7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -0.35;
key.shadow.camera.right = key.shadow.camera.top = 0.35;
key.shadow.bias = -0.0002;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9db8ff, 1.6);
rim.position.set(-0.7, 0.5, -0.8);
scene.add(rim);
scene.add(new THREE.AmbientLight(0x30343c, 0.7));

new GLTFLoader().load('out/kr5_apex.glb', (gltf) => {
  gltf.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(gltf.scene);
  document.getElementById('load').remove();
}, undefined, (err) => {
  document.getElementById('load').textContent =
    'Kunde inte läsa out/kr5_apex.glb — kör: FULL=1 python3 generate_drone.py';
  console.error(err);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
